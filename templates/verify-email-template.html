<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification - Tams Technology</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header img {
            max-width: 150px;
            display: block;
            margin: 0 auto;
        }

        .content {
            padding: 20px 0;
        }

        .content h1 {
            font-size: 22px;
            color: #333;
            text-align: center;
        }

        .content p {
            font-size: 14px;
            line-height: 1.6;
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #0056b3;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            margin: 20px auto;
            text-align: center;
            font-weight: bold;
        }

        .footer {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 15px;
            }

            .content h1 {
                font-size: 20px;
            }

            .btn {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="https://res.cloudinary.com/dinipxcvm/image/upload/v1736770179/Capture__2025-01-12-23-17-00_2_qv6nit.png"
                alt="Tams Technology Logo" />
        </div>

        <!-- Content -->
        <div class="content">
            <h1>Email Verification</h1>
            <p>Hello <strong>{{customerName}}</strong>,</p>
            <p>Thank you for registering with Tams Technology. Please verify your email address to activate your
                account.</p>
            <p style="text-align:center;">
                <a href="{{verificationLink}}" style=" background:#007BFF;color:white;padding:10px
                    20px;border-radius:6px;text-decoration:none">Verify Email</a>
            </p>
            <p>If you did not create an account, you can safely ignore this email.</p>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2025 Tams Technology. All rights reserved.
        </div>
    </div>
</body>

</html>
